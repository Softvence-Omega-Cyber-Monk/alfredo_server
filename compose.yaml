services:
  app:
    build: .
    image: ${DOCKER_USERNAME}/alfredo_backend:latest
    platform: linux/amd64
    container_name: alfredo_backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"    # ✅ localhost only, Nginx proxies to this
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./src/config/firebase-service-account.json:/app/src/config/firebase-service-account.json
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: alfredo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"    # ✅ localhost only, not exposed to internet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=200'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'effective_cache_size=1GB'
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge